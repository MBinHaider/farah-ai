<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="hsl(142 40% 38%)"/>
      <stop offset="100%" stop-color="hsl(142 40% 28%)"/>
    </linearGradient>
    <linearGradient id="steam" x1="200" y1="80" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Pot body -->
  <path d="M136 280 C136 260 140 240 160 230 L352 230 C372 240 376 260 376 280 L376 340 C376 380 340 410 300 410 L212 410 C172 410 136 380 136 340 Z" fill="white" opacity="0.95"/>
  <!-- Pot rim -->
  <rect x="120" y="218" width="272" height="24" rx="12" fill="white"/>
  <!-- Pot handles -->
  <rect x="88" y="224" width="44" height="12" rx="6" fill="hsl(36 70% 55%)"/>
  <rect x="380" y="224" width="44" height="12" rx="6" fill="hsl(36 70% 55%)"/>
  <!-- Steam wisps -->
  <path d="M200 190 Q190 160 200 130 Q210 100 200 70" stroke="white" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M256 180 Q246 150 256 120 Q266 90 256 60" stroke="white" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M312 190 Q302 160 312 130 Q322 100 312 70" stroke="white" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- F letterform inside pot -->
  <text x="216" y="355" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="130" fill="hsl(142 40% 35%)" opacity="0.9">F</text>
  <!-- AI badge -->
  <rect x="340" y="370" width="68" height="36" rx="18" fill="hsl(36 70% 55%)"/>
  <text x="374" y="396" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="white" text-anchor="middle">AI</text>
</svg>
